name = "thesmarttrade"
compatibility_date = "2026-11-01"
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "smarttrade-db"
database_id = "e4e2edf6-18fe-40f5-8c83-9a41c0c5215d"

[vars]
# Model used for every AI feature. Change any time without redeploying code.
CLAUDE_MODEL = "claude-sonnet-5-5"
# Max AI requests per user per day.
AI_DAILY_LIMIT = "60"
# Google sign-in (public OAuth client ID, not a secret).
GOOGLE_CLIENT_ID = "480257317582-51bdjp8su1tve6ue69ukd83kbtm84k0f.apps.googleusercontent.com"
# Who can open the admin panel (comma separated).
ADMIN_EMAILS = "adityaps700@gmail.com"
RAZORPAY_KEY_ID = "rzp_live_Tym5GVPkVU2PfP"
PAY_CURRENCY = "USD"
# Set to "false" to close sign-ups.
ALLOW_SIGNUP = "true"

# The Claude key is a SECRET, never put it here:
#   npx wrangler pages secret put ANTHROPIC_API_KEY
# For local dev, put it in a .dev.vars file:  ANTHROPIC_API_KEY=sk-ant-...
